<h2 id="ボーン-オーバーライドvrmについて">ボーン オーバーライド(VRM)について</h2>
<blockquote>
<p>モーションやポーズ、トラッキングを組み合わせて使えます。<br>
<br>
組み合わせを設定する「モーションとポーズ」と<br>
ポーズエディタ機能を提供する「カスタム・ポーズ」があります。</p>
</blockquote>
<h3 id="メニューから選択">メニューから選択</h3>
<blockquote>
<p><img src="image/bone_override_01.png" alt="画像"></p>
</blockquote>
<h3 id="モーションとポーズ">モーションとポーズ</h3>
<blockquote>
<p>上書きを行う部位を指定します。<br>
<br>
下半身に座るポーズや走るモーションを設定することで、<br>
アバターの上半身だけをトラッキングで動かす事が可能です。<br>
<br>
<img src="image/bone_override_02.png" alt="画像"></p>
</blockquote>
<h3 id="カスタムポーズ">カスタム・ポーズ</h3>
<blockquote>
<p>変更したい部位をリストから選択し、<br>
回転ＸＹＺを調整してポーズを作成します。<br>
<br>
<img src="image/bone_override_03.png" alt="画像"></p>
</blockquote>

</body>
